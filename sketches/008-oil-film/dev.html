<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>008 Oil Film · dev harness</title>
  <!--
    Standalone renderer test page (no UI). Query overrides any DEFAULTS key, plus:
      preset=<name>   apply a preset first      palette=<key>  load a palette into the colour slots
      w, h      output size (default 540 x 960)     t      time in seconds
      ss        samples per pixel (1 | 2 | 4)
      crop=x,y,cw,ch  draw only that window of the w x h image
      tiles=1   render via 2x2 renderRegion calls stitched into a 2D canvas (seam check)
      check=1   print seam diff, loop diff (t=0 vs t=loopSeconds), |grad h| distribution and frame timing into #info
      debug=1   thickness (grey)   debug=2  log2(|grad h| / reference) / 8 + 0.5 (r)   debug=3  crease fold mask   debug=4  one ramp cycle across the short side
    e.g. dev.html?t=3.5&palette=ember&seed=7&check=1
  -->
  <style>
    html, body { margin: 0; background: #222; }
    canvas { display: block; }
    #info { position: fixed; left: 8px; bottom: 8px; font: 12px/1.4 monospace; color: #0f0; background: #000c; padding: 4px 6px; white-space: pre; }
    #info:empty { display: none; }
  </style>
</head>
<body>
  <div id="info"></div>
  <script type="module">
    import { buildScene } from './scene.js';
    import { OilRenderer } from './oil-gl.js';
    import { DEFAULTS, presetLook, paletteColors } from './params.js';

    const q = new URLSearchParams(location.search);
    // dev-only knobs (renderer internals; NaN = built-in default)
    const P = { ...DEFAULTS, debug: 0, dbgWOct: NaN, dbgGain: NaN };
    if (q.has('seed')) P.seed = +q.get('seed');
    if (q.has('preset')) Object.assign(P, presetLook(q.get('preset'), P.seed));
    if (q.has('palette')) Object.assign(P, { palette: q.get('palette') }, paletteColors(q.get('palette'), P.seed));
    for (const [k, v] of q) {
      if (!(k in P) || k === 'palette') continue;
      const d = P[k];
      P[k] = typeof d === 'number' ? parseFloat(v) : typeof d === 'boolean' ? (v === '1' || v === 'true') : (v.startsWith('#') || /^[0-9a-f]{6}$/i.test(v) ? '#' + v.replace('#', '') : v);
    }
    for (const k of Object.keys(P)) if (Number.isNaN(P[k])) delete P[k];
    const w = parseInt(q.get('w') || '540', 10), h = parseInt(q.get('h') || '960', 10);
    const t = parseFloat(q.get('t') || String(P.time));
    const ss = parseInt(q.get('ss') || '1', 10);
    const info = document.getElementById('info');

    const renderer = new OilRenderer();
    renderer.setScene(buildScene(P.seed));

    if (q.get('tiles') === '1') {
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      const sx = Math.floor(w * 0.43), sy = Math.floor(h * 0.57);
      for (const [x, y, tw, th] of [[0, 0, sx, sy], [sx, 0, w - sx, sy], [0, sy, sx, h - sy], [sx, sy, w - sx, h - sy]]) {
        const px = renderer.renderRegion({ P, t, fullW: w, fullH: h, x, y, w: tw, h: th, ss });
        ctx.putImageData(new ImageData(new Uint8ClampedArray(px.buffer), tw, th), x, y);
      }
      document.body.appendChild(cv);
    } else {
      const cr = (q.get('crop') || '').split(',').map(Number);
      if (cr.length === 4) renderer.draw({ P, t, w: cr[2], h: cr[3], fullW: w, fullH: h, x: cr[0], y: cr[1], ss });
      else renderer.draw({ P, t, w, h, ss });
      document.body.appendChild(renderer.canvas);
    }

    if (q.get('check') === '1') {
      const diff = (a, b) => { let m = 0, n = 0; for (let i = 0; i < a.length; i++) { const d = Math.abs(a[i] - b[i]); if (d) n++; if (d > m) m = d; } return `max ${m}, ${n} bytes differ`; };
      const full = renderer.renderRegion({ P, t, fullW: w, fullH: h, x: 0, y: 0, w, h, ss }).slice();
      const tiled = new Uint8Array(w * h * 4);
      const sx = Math.floor(w * 0.43), sy = Math.floor(h * 0.57);
      for (const [x, y, tw, th] of [[0, 0, sx, sy], [sx, 0, w - sx, sy], [0, sy, sx, h - sy], [sx, sy, w - sx, h - sy]]) {
        const px = renderer.renderRegion({ P, t, fullW: w, fullH: h, x, y, w: tw, h: th, ss });
        for (let r = 0; r < th; r++) tiled.set(px.subarray(r * tw * 4, (r + 1) * tw * 4), ((y + r) * w + x) * 4);
      }
      renderer.draw({ P, t, w, h, ss });
      const gl = renderer.gl, dr = new Uint8Array(w * h * 4), flip = new Uint8Array(w * h * 4);
      gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, dr);
      for (let r = 0; r < h; r++) flip.set(dr.subarray((h - 1 - r) * w * 4, (h - r) * w * 4), r * w * 4);
      const a0 = renderer.renderRegion({ P, t: 0, fullW: w, fullH: h, x: 0, y: 0, w, h, ss }).slice();
      const aL = renderer.renderRegion({ P, t: P.loopSeconds, fullW: w, fullH: h, x: 0, y: 0, w, h, ss }).slice();
      const aE = renderer.renderRegion({ P, t: P.loopSeconds - 1 / 30, fullW: w, fullH: h, x: 0, y: 0, w, h, ss }).slice();
      const aH = renderer.renderRegion({ P, t: P.loopSeconds / 2, fullW: w, fullH: h, x: 0, y: 0, w, h, ss });
      // |grad h| distribution in units of the reference (debug 2: r = log2(gn) / 8 + 0.5)
      const dd = renderer.renderRegion({ P: { ...P, debug: 2 }, t, fullW: w, fullH: h, x: 0, y: 0, w, h, ss: 1 });
      const gs = [];
      for (let i = 0; i < dd.length; i += 16) gs.push(Math.pow(2, (dd[i] / 255 - 0.5) * 8));
      gs.sort((x, y) => x - y);
      const pct = (f) => gs[Math.min(gs.length - 1, Math.floor(f * gs.length))].toFixed(2);
      let lum = 0; for (let i = 0; i < full.length; i += 4) lum += (full[i] + full[i + 1] + full[i + 2]) / 3; lum /= full.length / 4;
      const one = new Uint8Array(4);
      const times = [];
      for (let i = 0; i < 4; i++) {
        const t0 = performance.now();
        renderer.draw({ P, t: t + i / 30, w, h, ss });
        gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, one);
        times.push(performance.now() - t0);
      }
      info.textContent = [
        `seam (2x2 tiles vs single region): ${diff(full, tiled)}`,
        `draw vs renderRegion: ${diff(full, flip)}`,
        `loop (t=0 vs t=loop): ${diff(a0, aL)}`,
        `loop (t=0 vs t=loop-1/30, expect small): ${diff(a0, aE)}`,
        `t=0 vs t=loop/2 (expect large): ${diff(a0, aH)}`,
        `|grad h| / ref: p10 ${pct(0.1)} p50 ${pct(0.5)} p90 ${pct(0.9)} p99 ${pct(0.99)} · mean luma ${lum.toFixed(1)}`,
        `frame ms (${w}x${h}, ss ${ss}): ${times.map((x) => x.toFixed(0)).join(' ')}`,
        `drift boost (1 = as asked): ${renderer.driftBoost.toFixed(2)}`,
        `renderer: ${gl.getParameter(gl.RENDERER)}`,
      ].join('\n');
    }
    window.renderer = renderer; window.P = P;
    document.title = 'done';
  </script>
</body>
</html>
